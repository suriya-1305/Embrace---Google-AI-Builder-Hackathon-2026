# Builds the shared API image from the repository root (needs /shared).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: "asia-south1-docker.pkg.dev/PROJECT/crysense/crysense-api:latest"
